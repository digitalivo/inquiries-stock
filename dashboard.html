<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Tracking — TikTok ke WhatsApp</title>
<meta name="robots" content="noindex,nofollow" />
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#262d36;
    --text:#e6edf3; --muted:#8b949e; --green:#3fb950; --blue:#58a6ff;
    --amber:#d29922; --pink:#f778ba;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:24px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
  h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
  h1 span{color:var(--green)}
  .meta{color:var(--muted);font-size:13px}
  button.refresh{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:9px 16px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;
  }
  button.refresh:hover{border-color:var(--green)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .stat .label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat .value{font-size:30px;font-weight:800;margin-top:6px}
  .stat .value.green{color:var(--green)} .stat .value.blue{color:var(--blue)}
  .stat .value.amber{color:var(--amber)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .box h2{font-size:15px;margin-bottom:14px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .bar-row{margin-bottom:12px}
  .bar-row .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .bar-row .top .n{font-weight:700}
  .bar{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px}
  .login{max-width:360px;margin:14vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
  .login h2{margin-bottom:14px;font-size:18px}
  .login input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;margin-bottom:12px}
  .login button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--green);color:#03150b;font-weight:700;font-size:15px;cursor:pointer}
  .err{color:#f85149;font-size:13px;margin-top:8px;min-height:18px}
  .empty{color:var(--muted);font-size:13.5px;padding:6px 2px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:6px}
  .spark > div{flex:1;background:linear-gradient(180deg,var(--green),#1a7f37);border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .spark .lbl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN (muncul kalau butuh password) -->
  <div id="login" class="login" style="display:none">
    <h2>🔒 Masuk Dashboard</h2>
    <input id="pw" type="password" placeholder="Password dashboard" />
    <button id="loginBtn">Masuk</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" style="display:none">
    <header>
      <div>
        <h1>Tracking <span>TikTok → WhatsApp</span></h1>
        <div class="meta" id="meta">Memuat...</div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="refresh" id="exportBtn">⬇ Ekspor CSV</button>
        <button class="refresh" id="refreshBtn">↻ Segarkan</button>
      </div>
    </header>

    <div class="cards" id="cards"></div>

    <div class="box">
      <h2>📈 Klik WhatsApp per Hari</h2>
      <div class="spark" id="spark"></div>
    </div>

    <div class="grid2">
      <div class="box">
        <h2>📞 Tujuan WhatsApp</h2>
        <div id="byNumber"></div>
      </div>
      <div class="box">
        <h2>🎯 per Campaign</h2>
        <div id="byCampaign"></div>
      </div>
    </div>

    <div class="box">
      <h2>🗓️ Ringkasan Harian (Visit vs Klik)</h2>
      <table>
        <thead><tr><th>Tanggal</th><th class="num">Visit</th><th class="num">Klik WA</th><th class="num">Rasio</th></tr></thead>
        <tbody id="dailyTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let PW = "";
let LAST = null; // data terakhir untuk ekspor CSV

function fmt(n){ return Number(n||0).toLocaleString("id-ID"); }

async function load(){
  const url = "/api/stats" + (PW ? ("?pw=" + encodeURIComponent(PW)) : "");
  const r = await fetch(url, { headers: PW ? { "x-dashboard-pw": PW } : {} });
  if(r.status === 401){ showLogin("Password salah."); return; }
  const d = await r.json();
  if(!d.ok){ showLogin("Gagal memuat data."); return; }
  render(d);
}

function showLogin(msg){
  document.getElementById("login").style.display = "block";
  document.getElementById("dash").style.display = "none";
  document.getElementById("loginErr").textContent = msg || "";
}

function render(d){
  LAST = d;
  document.getElementById("login").style.display = "none";
  document.getElementById("dash").style.display = "block";
  document.getElementById("meta").textContent =
    "Hari ini (WIB): " + d.today + " • diperbarui " + new Date().toLocaleTimeString("id-ID");

  // Kartu ringkasan
  const t = d.totals;
  document.getElementById("cards").innerHTML = `
    <div class="stat"><div class="label">Total Visit</div><div class="value blue">${fmt(t.visits)}</div></div>
    <div class="stat"><div class="label">Total Klik WA</div><div class="value green">${fmt(t.clicks)}</div></div>
    <div class="stat"><div class="label">Conversion Rate</div><div class="value amber">${t.ctr}%</div></div>
    <div class="stat"><div class="label">ttclid Unik (visit)</div><div class="value">${fmt(t.uniqueTtclidVisited)}</div></div>
    <div class="stat"><div class="label">ttclid Unik (klik)</div><div class="value">${fmt(t.uniqueTtclidClicked)}</div></div>
  `;

  // Sparkline klik per hari (gabungan)
  const days = Object.keys(d.clicksByDay).sort();
  const allDays = Array.from(new Set([...Object.keys(d.visitsByDay), ...days])).sort();
  const maxClick = Math.max(1, ...allDays.map(k => Number(d.clicksByDay[k]||0)));
  document.getElementById("spark").innerHTML = allDays.slice(-21).map(k=>{
    const val = Number(d.clicksByDay[k]||0);
    const h = Math.round((val/maxClick)*100);
    const short = k.slice(5); // MM-DD
    return `<div style="height:${h}%" title="${k}: ${val} klik"><span class="lbl">${short}</span></div>`;
  }).join("") || '<div class="empty">Belum ada data.</div>';

  // Klik per nomor (bar)
  renderBars("byNumber", d.clicksByNumber, "var(--green)");
  // Klik per campaign
  renderBars("byCampaign", d.clicksByCampaign, "var(--blue)");

  // Tabel harian
  const rows = allDays.sort().reverse().map(k=>{
    const vis = Number(d.visitsByDay[k]||0);
    const cl  = Number(d.clicksByDay[k]||0);
    const ratio = vis>0 ? ((cl/vis)*100).toFixed(1)+"%" : "—";
    return `<tr><td>${k}</td><td class="num">${fmt(vis)}</td><td class="num">${fmt(cl)}</td><td class="num">${ratio}</td></tr>`;
  }).join("");
  document.getElementById("dailyTable").innerHTML = rows || '<tr><td colspan="4" class="empty">Belum ada data.</td></tr>';
}

function renderBars(elId, obj, color){
  const entries = Object.entries(obj||{}).sort((a,b)=>Number(b[1])-Number(a[1]));
  if(!entries.length){ document.getElementById(elId).innerHTML = '<div class="empty">Belum ada data.</div>'; return; }
  const max = Math.max(1, ...entries.map(e=>Number(e[1])));
  document.getElementById(elId).innerHTML = entries.map(([k,v])=>{
    const pct = Math.round((Number(v)/max)*100);
    return `<div class="bar-row">
      <div class="top"><span>${k}</span><span class="n">${fmt(v)}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
    </div>`;
  }).join("");
}

// Login flow
document.getElementById("loginBtn").addEventListener("click", ()=>{
  PW = document.getElementById("pw").value.trim();
  sessionStorage.setItem("wapw", PW);
  load();
});
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("loginBtn").click(); });
document.getElementById("refreshBtn").addEventListener("click", load);

// Ekspor CSV: ringkasan harian (visit, klik, rasio) + breakdown nomor & campaign
function exportCSV(){
  if(!LAST){ return; }
  const d = LAST;
  const lines = [];
  const esc = (s)=>{ s=String(s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };

  lines.push("RINGKASAN");
  lines.push("metrik,nilai");
  lines.push("total_visit,"+(d.totals.visits));
  lines.push("total_klik_wa,"+(d.totals.clicks));
  lines.push("conversion_rate_persen,"+(d.totals.ctr));
  lines.push("ttclid_unik_visit,"+(d.totals.uniqueTtclidVisited));
  lines.push("ttclid_unik_klik,"+(d.totals.uniqueTtclidClicked));
  lines.push("");

  lines.push("HARIAN");
  lines.push("tanggal,visit,klik_wa,rasio_persen");
  const allDays = Array.from(new Set([...Object.keys(d.visitsByDay), ...Object.keys(d.clicksByDay)])).sort();
  allDays.forEach(k=>{
    const vis=Number(d.visitsByDay[k]||0), cl=Number(d.clicksByDay[k]||0);
    const ratio = vis>0 ? ((cl/vis)*100).toFixed(1) : "0";
    lines.push([esc(k),vis,cl,ratio].join(","));
  });
  lines.push("");

  lines.push("TUJUAN WHATSAPP");
  lines.push("nomor_tujuan,klik");
  Object.entries(d.clicksByNumber||{}).forEach(([k,v])=>lines.push(esc(k)+","+v));
  lines.push("");

  lines.push("KLIK PER CAMPAIGN");
  lines.push("campaign,klik");
  Object.entries(d.clicksByCampaign||{}).forEach(([k,v])=>lines.push(esc(k)+","+v));

  const blob = new Blob(["\ufeff"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "tracking-wa-"+d.today+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById("exportBtn").addEventListener("click", exportCSV);

// Auto-load: coba tanpa password dulu; kalau perlu pw, ambil dari sessionStorage
PW = sessionStorage.getItem("wapw") || "";
load();
// auto refresh tiap 30 detik
setInterval(()=>{ if(document.getElementById("dash").style.display==="block") load(); }, 30000);
</script>
</body>
</html>
