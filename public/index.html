<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ivorystudiortw</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palet minimalis: putih krem hangat */
    --bg:#f7f3ee;
    --ink:#1c1a17;
    --muted:#8a827a;
    --line:#1c1a17;
    --line-soft:rgba(28,26,23,.14);
    --wa:#25d366;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#ece8e2;
    color:var(--ink);
    overflow-x:hidden;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }

  /* ====== MOBILE FRAME ====== */
  .frame{
    width:100%;
    max-width:430px;
    margin:0 auto;
    background:var(--bg);
    position:relative;
    overflow:hidden;
  }
  @media (min-width:480px){
    body{padding:32px 16px;background:#e6e1da}
    .frame{
      min-height:auto;
      border-radius:32px;
      box-shadow:0 30px 80px -20px rgba(0,0,0,.15), 0 2px 0 rgba(255,255,255,.6) inset;
      overflow:hidden;
    }
  }

  /* ====== HERO ====== */
  .hero{
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1;          /* lebih pendek dari 4:5 → konten naik */
    max-height:54vh;              /* batasi tinggi di mobile supaya butang cepat kelihatan */
    overflow:hidden;
    background:#e6c8c0;
  }
  .hero img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 20%;   /* angkat framing supaya tidak terpotong di bahagian penting */
    display:block;
    animation:fade 1s ease both;
  }
  .hero::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-1px;height:78%;
    background:linear-gradient(to bottom,
      rgba(247,243,238,0) 0%,
      rgba(247,243,238,.20) 24%,
      rgba(247,243,238,.55) 50%,
      rgba(247,243,238,.88) 76%,
      var(--bg) 100%);
    pointer-events:none;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ====== IDENTITI ====== */
  .id{
    text-align:center;
    padding:8px 28px 0;
    margin-top:-18px;
    position:relative;
    z-index:2;
    animation:rise .7s ease both;
  }
  .handle{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:27px;
    letter-spacing:-.3px;
    line-height:1.1;
    color:var(--ink);
  }
  /* ===== PILL META (Verified + followers) ala contoh ===== */
  .meta{
    margin-top:16px;
    display:flex;align-items:center;justify-content:center;
    gap:9px;
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 14px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.1px;
    background:rgba(28,26,23,.05);
    color:var(--ink);
    border:1px solid rgba(28,26,23,.06);
  }
  .pill.verified{color:var(--ink)}
  .pill.verified svg{width:15px;height:15px;flex:none}
  .pill.followers{color:#6b645c;font-weight:500}
  .pill.followers b{color:var(--ink);font-weight:600}

  /* ====== DIVIDER LABEL ====== */
  .divider{
    display:flex;align-items:center;gap:14px;
    padding:0 28px;
    margin:48px 0 20px;
    animation:rise .55s ease both;
  }
  .divider .line{
    flex:1;height:1px;background:var(--line-soft);
  }
  .divider .label{
    font-size:10.5px;
    font-weight:500;
    letter-spacing:2.4px;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }

  /* ====== BUTANG OVAL ELEGAN ====== */
  .links{padding:0 28px;display:flex;justify-content:center}
  .link.wa{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    width:100%;
    background:var(--ink);
    color:#f7f3ee;
    border:none;
    border-radius:999px;
    padding:20px 28px;
    text-decoration:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:14.5px;
    letter-spacing:.3px;
    box-shadow:0 14px 36px -10px rgba(28,26,23,.35), 0 2px 0 rgba(255,255,255,.05) inset;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    animation:rise .6s ease both, pulseGlow 3.5s ease-in-out 1.2s infinite;
  }
  .link.wa:hover{
    transform:translateY(-2px);
    background:#2a2622;
    box-shadow:0 20px 48px -10px rgba(28,26,23,.45);
  }
  .link.wa:active{transform:translateY(0)}
  .link.wa .wa-ico{
    width:18px;height:18px;flex:none;
  }
  .link.wa .wa-ico path{fill:var(--wa)}
  .link.wa .label{line-height:1.2;white-space:nowrap}
  .link.wa .arrow{
    width:14px;height:14px;flex:none;opacity:.7;
    transition:transform .25s ease;
  }
  .link.wa:hover .arrow{transform:translateX(3px);opacity:1}

  /* Halo lembut untuk menarik perhatian */
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 14px 36px -10px rgba(28,26,23,.35), 0 0 0 0 rgba(37,211,102,0)}
    50%{box-shadow:0 14px 36px -10px rgba(28,26,23,.35), 0 0 0 10px rgba(37,211,102,.08)}
  }

  .spinner{
    width:16px;height:16px;border-radius:50%;display:none;flex:none;
    border:2px solid rgba(247,243,238,.25);
    border-top-color:#f7f3ee;
    animation:spin .7s linear infinite;
  }
  .link.wa.loading .wa-ico{display:none}
  .link.wa.loading .arrow{display:none}
  .link.wa.loading .spinner{display:block}

  /* Sari kata kecil di bawah butang */
  .hint{
    text-align:center;
    margin-top:14px;
    padding:0 28px;
    color:var(--muted);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:13.5px;
    letter-spacing:.1px;
    animation:rise .6s .15s ease both;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ====== FOOTER ====== */
  footer{
    text-align:center;
    margin-top:36px;
    padding:0 28px 32px;
    color:var(--muted);
    font-size:10.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
  }
  footer .mark{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:14px;
    letter-spacing:.2px;
    text-transform:none;
    color:var(--ink);
    display:block;
    margin-bottom:6px;
  }
</style>
</head>
<body>
  <div class="frame">

    <!-- HERO -->
    <div class="hero">
      <img src="https://ftorxltiinlltdjiwbme.supabase.co/storage/v1/object/public/test/2.png" alt="Ivory Studio Ready to Wear" />
    </div>

    <!-- HANDLE + META -->
    <div class="id">
      <div class="handle">@ivorystudiortw</div>
      <div class="meta">
        <span class="pill verified">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12.79 22.69a1.5 1.5 0 0 0-1.58 0l-.49.3a1.5 1.5 0 0 1-2.02-.43l-.33-.48a1.5 1.5 0 0 0-1.44-.64l-.57.08a1.5 1.5 0 0 1-1.67-1.22l-.1-.57a1.5 1.5 0 0 0-1.06-1.17l-.55-.16a1.5 1.5 0 0 1-1.04-1.79l.14-.56a1.5 1.5 0 0 0-.49-1.5l-.44-.37a1.5 1.5 0 0 1-.21-2.06l.35-.45a1.5 1.5 0 0 0 .16-1.57l-.25-.52a1.5 1.5 0 0 1 .64-1.97l.51-.27a1.5 1.5 0 0 0 .79-1.36l-.02-.58a1.5 1.5 0 0 1 1.39-1.54l.57-.04a1.5 1.5 0 0 0 1.27-.93l.22-.53a1.5 1.5 0 0 1 1.89-.84l.54.19a1.5 1.5 0 0 0 1.54-.32l.42-.4a1.5 1.5 0 0 1 2.07 0l.42.4c.41.39 1.01.51 1.54.32l.54-.19a1.5 1.5 0 0 1 1.89.84l.22.53a1.5 1.5 0 0 0 1.27.93l.57.04a1.5 1.5 0 0 1 1.39 1.54l-.02.58a1.5 1.5 0 0 0 .79 1.36l.51.27a1.5 1.5 0 0 1 .64 1.97l-.25.52a1.5 1.5 0 0 0 .16 1.57l.35.45a1.5 1.5 0 0 1-.21 2.06l-.44.37a1.5 1.5 0 0 0-.49 1.5l.14.56a1.5 1.5 0 0 1-1.04 1.79l-.55.16a1.5 1.5 0 0 0-1.06 1.17l-.1.57a1.5 1.5 0 0 1-1.67 1.22l-.57-.08a1.5 1.5 0 0 0-1.44.64l-.33.48a1.5 1.5 0 0 1-2.02.43z" fill="#1d9bf0"/>
            <path d="m7.6 11.34 3.18 3.18 6.37-6.36" stroke="#fff" stroke-width="3"/>
          </svg>
          Verified
        </span>
        <span class="pill followers"><b>2.3M</b>&nbsp;followers</span>
      </div>
    </div>

    <!-- SECTION: KHIDMAT PERSENDIRIAN -->
    <div class="divider">
      <span class="line"></span>
      <span class="label">Khidmat Tempahan Persendirian</span>
      <span class="line"></span>
    </div>

    <div class="links">
      <a class="link wa" id="waBtn" role="button">
        <svg class="wa-ico" viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Z"/></svg>
        <span class="spinner"></span>
        <span class="label" id="waLabel">Ready Stock Inquiries on WhatsApp</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
    <p class="hint">Tempahan persendirian &amp; rujukan stok sedia ada.</p>

    <footer>
      <span class="mark">Ivory Studio</span>
      © ivorystudiortw
    </footer>
  </div>

<script>
  // === LOGIK TRACKING (tidak diubah) ===
  const params = new URLSearchParams(window.location.search);
  const payload = {
    utm_source:   params.get("utm_source"),
    utm_id:       params.get("utm_id"),
    utm_campaign: params.get("utm_campaign"),
    utm_medium:   params.get("utm_medium"),
    ttclid:       params.get("ttclid"),
  };

  try {
    fetch("/api/track-visit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true,
    }).catch(()=>{});
  } catch(e){}

  const btn = document.getElementById("waBtn");
  const label = document.getElementById("waLabel");
  btn.addEventListener("click", function () {
    btn.classList.add("loading");
    label.textContent = "Connecting to WhatsApp...";

    const qs = new URLSearchParams();
    if (payload.utm_source)   qs.set("utm_source", payload.utm_source);
    if (payload.utm_campaign) qs.set("utm_campaign", payload.utm_campaign);
    if (payload.ttclid)       qs.set("ttclid", payload.ttclid);
    const customText = params.get("text");
    if (customText) qs.set("text", customText);

    setTimeout(function () {
      window.location.href = "/api/go?" + qs.toString();
    }, 550);
  });
</script>
</body>
</html>
